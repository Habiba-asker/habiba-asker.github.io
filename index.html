<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive bilingual Digital Forensics lab by Eng. Habiba Asker | معمل تفاعلي للتحقيق الجنائي الرقمي">
<title>Habiba Asker | Digital Forensics Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071321;--p1:#102238;--p2:#0b1c2e;--blue:#38bdf8;--cyan:#67e8f9;--w:#edf7ff;--mut:#a8bdd0;--grn:#4ade80;--pink:#c084fc;--gold:#facc15;--red:#f87171;--bd:#23415c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--w);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#38bdf80a 1px,transparent 1px),linear-gradient(90deg,#38bdf80a 1px,transparent 1px);background-size:34px 34px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{width:min(1100px,90%);margin-inline:auto}
nav{position:sticky;top:0;z-index:50;background:#071321ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:10px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--cyan);white-space:nowrap}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{color:var(--mut);text-decoration:none;font-size:14px}.links a:hover{color:var(--cyan)}
.hud{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cyan)}
.xpbar{width:90px;height:8px;background:#23394d;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .5s}
.btn{border:1px solid var(--blue);background:transparent;color:var(--cyan);padding:9px 16px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn:hover{background:var(--blue);color:#061321}.btn.pri{background:var(--blue);color:#061321;font-weight:600}.btn.sm{padding:6px 12px;font-size:14px}
[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}
.hero{min-height:82vh;display:grid;place-items:center;text-align:center;padding:60px 16px}
.orb{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--blue);display:grid;place-items:center;font-size:50px;background:none;box-shadow:0 0 38px #38bdf844,inset 0 0 28px #38bdf822;animation:fl 4s ease-in-out infinite;cursor:pointer}
.orb:active{transform:scale(.9)}
@keyframes fl{50%{transform:translateY(-9px)}}
.hero h1{font-size:clamp(40px,8vw,78px);line-height:1.15;margin:8px 0}.hero h1 span{color:var(--blue)}
.hero h2{font-size:clamp(17px,3vw,24px);color:var(--cyan);font-weight:600}
.term{display:inline-block;margin:18px auto;background:#050e18;border:1px solid var(--bd);border-radius:10px;padding:8px 16px;font-family:Consolas,monospace;color:var(--grn);min-height:42px;direction:ltr;unicode-bidi:plaintext;max-width:100%}
.term:after{content:"▌";animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.hero p{color:var(--mut);max-width:680px;margin:6px auto 18px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.bdg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bdg span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:1px dashed var(--bd);filter:grayscale(1);opacity:.4;transition:.4s}
.bdg span.on{filter:none;opacity:1;border:1px solid var(--gold);box-shadow:0 0 14px #facc1555}
section{padding:56px 0}
h2.hd{font-size:clamp(24px,4vw,34px);margin-bottom:4px}.sub{color:var(--mut);margin-bottom:22px}
.card,.panel{background:linear-gradient(145deg,var(--p1),var(--p2));border:1px solid var(--bd);border-radius:16px;padding:20px}
.panel{border-color:var(--blue);margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--bd);background:var(--p1);color:var(--mut);padding:9px 14px;border-radius:10px}
.tab.on,.tab:hover{background:#124267;color:#fff;border-color:var(--blue)}
.info{margin-top:12px;min-height:120px}.info h3,.card h3{color:var(--cyan);margin-bottom:4px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid #38bdf855;background:#38bdf812;color:var(--cyan);border-radius:30px;padding:3px 11px;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps .tab{text-align:center}.steps b{display:block;font-size:22px;color:var(--cyan)}
.tool{text-align:start;width:100%;min-height:150px;transition:.25s}.tool:hover{border-color:var(--blue);transform:translateY(-4px)}
.tool .e{font-size:30px}.tool p{color:var(--mut);font-size:14px}.tool .use{color:var(--grn);margin-top:6px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:120px;color:var(--mut);font-size:14px}
input{flex:1;min-width:200px;background:#050e18;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;direction:ltr;font-family:Consolas,monospace}
.hx{font-family:Consolas,monospace;font-size:13px;word-break:break-all;direction:ltr;text-align:left;background:#050e18;border-radius:9px;padding:8px 10px;color:var(--cyan);width:100%}
mark{background:#f8717155;color:#fff;border-radius:3px}
.fb{margin-top:10px;min-height:28px;font-weight:600}.ok{color:var(--grn)}.bad{color:var(--red)}.warn{color:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.mc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.mc .e{font-size:34px}.mc h3{margin:0}
.done:after{content:" ✓";color:var(--grn)}
.ex{white-space:pre-line;direction:ltr;text-align:left;background:#050e18;border-radius:9px;padding:10px 12px;font-family:Consolas,monospace;font-size:13px;margin:10px 0;color:var(--gold)}
.ch{display:block;width:100%;text-align:start;background:#0b1b2c;border:1px solid var(--bd);padding:11px 14px;border-radius:9px;margin:8px 0;transition:.2s}
.ch:hover:not(:disabled){border-color:var(--cyan);background:#16334d}.ch:disabled{cursor:default}
.ch.right{border-color:var(--grn);background:#12352e}.ch.wrong{border-color:var(--red);background:#3a1a22}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-top:14px}
.hi{min-height:128px;border:1px solid var(--bd);border-radius:13px;background:linear-gradient(145deg,#173957,#0b1b2c);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.2s}
.hi:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-3px)}.hi .big{font-size:36px}.hi small{color:var(--mut)}
.hi.found{border-color:var(--grn);background:#12352e}.hi.miss{border-color:var(--gold);opacity:.75}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stat span{background:#0b1b2c;border:1px solid var(--bd);border-radius:9px;padding:5px 12px;color:var(--cyan)}
.prog{height:9px;background:#23394d;border-radius:20px;margin:12px 0;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));transition:.3s}
footer{text-align:center;padding:28px 14px;border-top:1px solid var(--bd);color:var(--mut)}
#toast{position:fixed;bottom:22px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--p1);border:1px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:30px;z-index:90;opacity:0;transform:translateY(20px);transition:.35s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.cf{position:fixed;top:-24px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(540deg);opacity:0}}
@media(max-width:760px){.steps{grid-template-columns:repeat(2,1fr)}nav{justify-content:center}.links{order:3;width:100%;justify-content:center}section{padding:42px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

[['Analysis','التحليل'],['Interpret the results and correlate findings to answer the investigation questions.','تفسير النتائج وربط الأدلة للإجابة عن أسئلة التحقيق.']],
[['Reporting','التقرير'],['Document methods, findings, limitations and conclusions in a clear report.','توثيق الأساليب والنتائج والقيود والاستنتاجات في تقرير واضح.']]];
const TL=[['🔎','Autopsy',['Analyze disk images and file system artifacts.','تحليل صور الأقراص وآثار أنظمة الملفات.'],['Use it to browse a disk image and recover deleted files.','استخدميها لتصفّح صورة قرص واستعادة الملفات المحذوفة.']],
['💽','FTK Imager',['Acquire and preview forensic images.','إنشاء ومعاينة الصور الجنائية للأدلة.'],['Use it first, to copy a drive without changing it.','استخدميها أولاً لنسخ القرص دون تغيير محتواه.']],
['🌐','Wireshark',['Inspect captured network traffic.','فحص حركة الشبكة الملتقطة.'],['Use it to see who talked to whom, and when.','استخدميه لمعرفة من تواصل مع من ومتى.']],
['🧠','Volatility',['Analyze captured memory dumps.','تحليل نسخ الذاكرة الملتقطة.'],['Use it to find hidden processes in RAM.','استخدميها لاكتشاف العمليات المخفية في الذاكرة.']],
['🐧','Linux',['An environment full of investigation utilities.','بيئة مليئة بأدوات التحقيق.'],['Use it for tools like sha256sum, grep and dd.','استخدميه لأدوات مثل sha256sum وgrep وdd.']],
['🐍','Python',['Automate analysis and process data.','أتمتة التحليل ومعالجة البيانات.'],['Use it to parse thousands of log lines in seconds.','استخدميها لتحليل آلاف أسطر السجلات في ثوانٍ.']]];
const MS=[
{id:'crime',e:'🕵️',t:['The USB drive','وحدة الـ USB'],q:['A USB drive is found next to a workstation in a suspected data leak. What is the safest first step?','عُثر على وحدة USB بجانب جهاز عمل في واقعة اشتباه بتسريب بيانات. ما أول خطوة آمنة؟'],c:[['Open every file to see what is inside','فتح كل الملفات لمعرفة محتواها'],['Document it and preserve it using approved procedures','توثيقها والحفاظ عليها وفق الإجراءات المعتمدة'],['Format it to remove any threat','عمل Format لها للتخلص من أي تهديد']],a:1,w:['Correct! Document and preserve before examining.','صحيح! الحفظ والتوثيق قبل أي فحص.']},
{id:'evidence',e:'🗂️',t:['Useful evidence','الدليل المفيد'],q:['Which item may show when a file was last accessed?','أي عنصر قد يوضح وقت آخر وصول إلى ملف؟'],c:[['File metadata and timestamps','البيانات الوصفية والطوابع الزمنية'],['The desktop wallpaper','خلفية سطح المكتب'],['Monitor brightness','سطوع الشاشة']],a:0,w:['Correct! Timestamps help build a timeline, once validated.','صحيح! الطوابع الزمنية تساعد في بناء التسلسل بعد التحقق منها.']},
{id:'phishing',e:'📧',t:['Catch the phishing','اكتشفي التصيّد'],x:'From: it-support@micr0soft-help.com\nSubject: URGENT! Verify within 10 minutes\nhttp://login-verify.example/secure',q:['Which sign is the strongest warning here?','ما أقوى علامة تحذير هنا؟'],c:[['The email has a company logo','الرسالة تحمل شعار شركة'],['A misspelled sender domain and an urgent login link','نطاق مرسل مكتوب بشكل خاطئ ورابط دخول عاجل'],['The email starts with a greeting','الرسالة تبدأ بتحية']],a:1,w:['Correct! Fake domain plus urgency is classic phishing.','صحيح! نطاق مزيّف مع استعجال هو أسلوب التصيّد المعروف.']},
{id:'timeline',e:'🕒',t:['Rebuild the timeline','أعيدي بناء التسلسل'],x:'09:06  ALERT raised\n09:02  LOGIN from unknown device\n09:05  FILE confidential.xlsx opened',q:['Using the timestamps, what is the correct order?','باستخدام الطوابع الزمنية، ما الترتيب الصحيح؟'],c:[['Alert → login → file opened','التنبيه ← الدخول ← فتح الملف'],['Login → file opened → alert','الدخول ← فتح الملف ← التنبيه'],['File opened → alert → login','فتح الملف ← التنبيه ← الدخول']],a:1,w:['Correct! 09:02, then 09:05, then 09:06.','صحيح! 09:02 ثم 09:05 ثم 09:06.']},
{id:'valid',e:'⚖️',t:['Evidence or not?','دليل أم لا؟'],q:['Which item is most relevant in a file-copy investigation?','أي عنصر أكثر ارتباطاً بتحقيق نسخ الملفات؟'],c:[['USB connection records and system logs','سجلات توصيل USB وسجلات النظام'],['Desk decoration','زينة المكتب'],['Room paint color','لون طلاء الغرفة']],a:0,w:['Correct! Device records and logs help reconstruct events.','صحيح! سجلات الأجهزة والنظام تساعد في إعادة بناء الأحداث.']}];
const HI=[['💻',['Computer','الكمبيوتر'],1,['It may hold files and system artifacts.','قد يحتوي على ملفات وآثار نظام.']],['📜',['System logs','سجلات النظام'],1,['Logs show what happened and when.','السجلات توضح ما حدث ومتى.']],['🖼️',['Wallpaper','الخلفية'],0,['Not useful for proving file copying.','لا تفيد في إثبات نسخ الملفات.']],['🕒',['File timestamps','الطوابع الزمنية'],1,['They help build a timeline, once validated.','تساعد في بناء التسلسل بعد التحقق.']],['☕',['Coffee cup','فنجان القهوة'],0,['Not digital evidence.','ليس دليلاً رقمياً.']],['🔌',['USB record','سجل USB'],1,['Shows when a device was connected.','يوضح وقت توصيل الجهاز.']]];
const QZ=[{q:['What is the main purpose of digital forensics?','ما الهدف الأساسي من التحقيق الجنائي الرقمي؟'],c:[['Modify digital files','تعديل الملفات الرقمية'],['Scientifically examine digital evidence','فحص الأدلة الرقمية علمياً'],['Create games','إنشاء الألعاب']],a:1,w:['It examines evidence using scientific methods.','يفحص الأدلة بأساليب علمية.']},
{q:['What does the chain of custody document?','ماذا توثّق سلسلة الحيازة؟'],c:[['Screen resolution','دقة الشاشة'],['Who handled the evidence, when and how','من تعامل مع الدليل ومتى وكيف'],['Internet speed','سرعة الإنترنت']],a:1,w:['It records every handling and transfer.','تسجّل كل تعامل ونقل للدليل.']},
{q:['Which tool is common for packet analysis?','أي أداة شائعة لتحليل الحزم؟'],c:[['Wireshark','Wireshark'],['Autopsy','Autopsy'],['Word','Word']],a:0,w:['Wireshark is a network protocol analyzer.','Wireshark محلّل لبروتوكولات الشبكة.']},
{q:['What can a hash value help verify?','ماذا تساعد قيمة الـ Hash على التحقق منه؟'],c:[['That evidence has not changed','أن الدليل لم يتغير'],['Screen size','حجم الشاشة'],['Internet provider','مزوّد الإنترنت']],a:0,w:['A matching hash shows the copy is unchanged.','تطابق البصمة يعني أن النسخة لم تتغير.']},
{q:['What is the first phase of the investigation?','ما أول مرحلة في التحقيق؟'],c:[['Reporting','كتابة التقرير'],['Collection','الجمع'],['Analysis','التحليل']],a:1,w:['The workflow starts with collection.','تبدأ الخطوات بمرحلة الجمع.']}];
const BG={crime:'🕵️',evidence:'🗂️',phishing:'📧',timeline:'🕒',valid:'⚖️',hunt:'🔎',hash:'🔐',quiz:'🏆'};

/* ---------- XP, level, badges ---------- */
const LV=[0,25,60,100];
function lvl(){let i=0;LV.forEach((v,n)=>{if(S.xp>=v)i=n});return i}
function hud(){const i=lvl(),nx=LV[i+1],lo=LV[i];$('#lv').textContent=t(T.lvls[i]);$('#xp').textContent=S.xp;$('#xpf').style.width=(nx?(S.xp-lo)/(nx-lo)*100:100)+'%';
$('#bdg').innerHTML=Object.entries(BG).map(([k,e])=>`<span class="${S.b.includes(k)?'on':''}">${e}</span>`).join('')}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('show'),2300)}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<24;i++){const e=document.createElement('i');e.className='cf';e.textContent=['✨','🔹','⭐','🔷'][i%4];e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.4}s;--x:${(Math.random()-.5)*220}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
function award(id,pts){if(S.b.includes(id))return;const old=lvl();S.b.push(id);S.xp+=pts;ST('hs',JSON.stringify(S));hud();renderMissions();boom();
toast(`${BG[id]} +${pts} XP`+(lvl()>old?' · '+t(T.lvls[lvl()]):''))}
function orb(){const e=$('.orb');e.style.transform='rotate(360deg) scale(1.2)';e.style.transition='.6s';setTimeout(()=>{e.style.transform='';e.style.transition=''},600);boom();toast(L=='en'?'🕵️ Case closed, detective!':'🕵️ أُغلقت القضية أيتها المحقّقة!')}

/* ---------- language ---------- */
function setLang(){L=L=='en'?'ar':'en';ST('lang',L);applyLang()}
function applyLang(){document.documentElement.lang=L;document.documentElement.dir=L=='en'?'ltr':'rtl';
$$('[data-t]').forEach(e=>e.textContent=t(T[e.dataset.t]));$('#lb').textContent=L=='en'?'العربية':'English';
renderEv();renderSt();renderTools();renderMissions();renderM();renderHunt();renderQ();hud();hashUI();typeStart()}

/* ---------- typing line ---------- */
let tp=0,tc=0,tt;
function typeStart(){clearTimeout(tt);tp=0;tc=0;typeTick()}
function typeTick(){const s=t(PH[tp]),el=$('#term');
if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=s;return}
el.textContent=s.slice(0,tc);if(tc<s.length){tc++;tt=setTimeout(typeTick,70)}else{tt=setTimeout(()=>{tp=(tp+1)%PH.length;tc=0;typeTick()},1600)}}

/* ---------- evidence & process ---------- */
let ei=0,si=0;
function renderEv(){$('#evTabs').innerHTML=EV.map((e,i)=>`<button class="tab ${i==ei?'on':''}" onclick="ei=${i};renderEv()">${e[0]} ${t(e[1])}</button>`).join('');
const e=EV[ei];$('#evInfo').innerHTML=`<h3>${e[0]} ${t(e[1])}</h3><p>${t(e[2])}</p><div class="pills">${e[3].map(p=>`<span class="pill">${t(p)}</span>`).join('')}</div>`}
function renderSt(){$('#stTabs').innerHTML=SP.map((s,i)=>`<button class="tab ${i==si?'on':''}" onclick="si=${i};renderSt()"><b>0${i+1}</b>${t(s[0])}</button>`).join('');
const s=SP[si];$('#stInfo').innerHTML=`<h3>0${si+1} · ${t(s[0])}</h3><p>${t(s[1])}</p>`}

/* ---------- hash lab ---------- */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
async function hashUI(){const a=await sha($('#h1').value),b=await sha($('#h2').value),s=$('#hs');
if(!a){s.className='fb warn';s.textContent=t(T.noc);return}
$('#ha').textContent=a;$('#hb').innerHTML=[...b].map((c,i)=>c==a[i]?c:`<mark>${c}</mark>`).join('');
const same=a==b;s.className='fb '+(same?'ok':'bad');s.textContent=t(same?T.same:T.diff);if(!same)award('hash',15)}

/* ---------- tools ---------- */
function renderTools(){$('#toolGrid').innerHTML=TL.map((x,i)=>`<button class="card tool" onclick="this.classList.toggle('open');this.querySelector('.use').hidden=!this.querySelector('.use').hidden"><div class="e">${x[0]}</div><h3>${x[1]}</h3><p>${t(x[2])}</p><p class="use" hidden>💡 ${t(x[3])}</p></button>`).join('')}

/* ---------- shared choices ---------- */
function choices(box,it,st,pick){box.innerHTML='';it.c.forEach((c,i)=>{const b=document.createElement('button');b.className='ch';b.textContent=(L=='en'?'ABC':'أبج')[i]+'. '+t(c);
if(st.done){b.disabled=true;if(i==it.a)b.classList.add('right');else if(i==st.sel)b.classList.add('wrong')}
else if(st.wrong.has(i)){b.disabled=true;b.classList.add('wrong')}else b.onclick=()=>pick(i);box.appendChild(b)})}

/* ---------- missions ---------- */
let cm=null,ms;
function renderMissions(){$('#mGrid').innerHTML=MS.map(m=>`<article class="card mc"><div class="e">${m.e}</div><h3 class="${S.b.includes(m.id)?'done':''}">${t(m.t)}</h3><button class="btn sm" onclick="openM('${m.id}')">${t(T.start)} <span class="arr">→</span></button></article>`).join('')}
function openM(id){cm=id;ms={done:false,sel:null,wrong:new Set()};$('#mp').hidden=false;renderM();$('#mp').scrollIntoView({behavior:'smooth',block:'center'})}
function closeM(){cm=null;$('#mp').hidden=true}
function renderM(){if(!cm)return;const m=MS.find(x=>x.id==cm);$('#mt').textContent=t(m.t);$('#mq').textContent=t(m.q);$('#mx').hidden=!m.x;$('#mx').textContent=m.x||'';
choices($('#mc'),m,ms,i=>{if(i==m.a){ms.done=true;ms.sel=i;award(m.id,10)}else{ms.wrong.add(i);$('#mp').classList.remove('shake');void $('#mp').offsetWidth;$('#mp').classList.add('shake')}renderM()});
const f=$('#mf');f.className='fb '+(ms.done?'ok':'warn');f.textContent=ms.done?t(m.w):(ms.wrong.size?t(T.retry):'')}

/* ---------- evidence hunt ---------- */
let hf=new Set(),hm=new Set(),hdone=false;
function renderHunt(){$('#hg').innerHTML=HI.map((x,i)=>{const s=hf.has(i)?'found':hm.has(i)?'miss':'';return`<button class="hi ${s}" ${s?'disabled':''} onclick="inspect(${i})"><span class="big">${x[0]}</span><b>${t(x[1])}</b><small>${s=='found'?t(T.rel):s=='miss'?t(T.nrel):t(T.inspect)}</small></button>`}).join('');
$('#hf').textContent=hf.size;$('#ht').textContent=hf.size+hm.size;if(hdone){$('#hfb').className='fb ok';$('#hfb').textContent=t(T.win)}}
function inspect(i){if(hdone)return;const x=HI[i];(x[2]?hf:hm).add(i);if(hf.size==4){hdone=true;award('hunt',20)}renderHunt();
const f=$('#hfb');if(!hdone){f.className='fb '+(x[2]?'ok':'warn');f.textContent=(x[2]?'✓ ':'✗ ')+t(x[1])+': '+t(x[3])}if(!x[2])$$('.hi')[i].classList.add('shake')}
function resetHunt(){hf.clear();hm.clear();hdone=false;$('#hfb').textContent='';renderHunt()}

/* ---------- quiz ---------- */
let qi=0,qs={done:false,sel:null,wrong:new Set()},qsc=0,qend=false;
function renderQ(){const q=QZ[qi];$('#qx').hidden=!qs.done&&!qend;
if(qend){$('#qn').textContent=t(T.qdone);$('#qp').style.width='100%';$('#qq').textContent=(L=='en'?'Score: ':'النتيجة: ')+qsc+' / '+QZ.length;$('#qa').innerHTML='';
$('#qf').className='fb ok';$('#qf').textContent=t(qsc==5?T.star:T.good);$('#qx').textContent=t(T.retryQ);$('#qx').hidden=false;return}
$('#qn').textContent=(L=='en'?`Question ${qi+1} of 5`:`السؤال ${qi+1} من 5`);$('#qp').style.width=(qi/5*100)+'%';$('#qq').textContent=t(q.q);
choices($('#qa'),q,qs,i=>{qs.done=true;qs.sel=i;if(i==q.a)qsc++;renderQ()});
const f=$('#qf');if(qs.done){const ok=qs.sel==q.a;f.className='fb '+(ok?'ok':'bad');f.textContent=(ok?'✓ ':'✗ ')+t(q.w)}else{f.textContent=''}
$('#qx').textContent=t(qi==4?T.res:T.next)}
function qNext(){if(qend){qi=0;qsc=0;qend=false}else if(qi<4)qi++;else{qend=true;if(qsc>0)award('quiz',qsc*5);renderQ();return}
qs={done:false,sel:null,wrong:new Set()};renderQ()}

applyLang();
</script>
</body>
</html>
