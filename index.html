<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habiba Asker | Digital Forensics Lab</title>

<style>
:root {
--bg:#071321;
--panel:#102238;
--panel2:#0c2035;
--blue:#38bdf8;
--cyan:#67e8f9;
--white:#edf7ff;
--muted:#a8bdd0;
--green:#4ade80;
--pink:#c084fc;
--border:#23415c;
--gold:#facc15;
}

* {
box-sizing:border-box;
margin:0;
padding:0;
}

html {
scroll-behavior:smooth;
}

body {
background:var(--bg);
color:var(--white);
font-family:Arial,sans-serif;
line-height:1.7;
overflow-x:hidden;
}

body:before {
content:"";
position:fixed;
inset:0;
z-index:-1;
background-image:
linear-gradient(#38bdf808 1px,transparent 1px),
linear-gradient(90deg,#38bdf808 1px,transparent 1px);
background-size:35px 35px;
}

nav {
position:sticky;
top:0;
z-index:20;
background:#071321ed;
backdrop-filter:blur(15px);
padding:13px 5%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--border);
gap:12px;
flex-wrap:wrap;
}

.logo {
color:var(--cyan);
font-weight:bold;
letter-spacing:2px;
}

nav a {
color:var(--muted);
text-decoration:none;
margin:0 6px;
font-size:13px;
}

nav a:hover {
color:var(--cyan);
}

button {
cursor:pointer;
font:inherit;
}

.lang,.btn {
border:1px solid var(--blue);
background:transparent;
color:var(--cyan);
padding:10px 16px;
border-radius:9px;
transition:.2s;
text-decoration:none;
display:inline-block;
}

.btn.primary {
background:var(--blue);
color:#061321;
font-weight:bold;
}

.btn:hover,.lang:hover {
background:var(--blue);
color:#061321;
transform:translateY(-2px);
}

.hero {
min-height:78vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:65px 20px;
}

.tag {
color:var(--green);
font-size:12px;
letter-spacing:2px;
}

.hero h1 {
font-size:clamp(42px,8vw,78px);
margin:15px 0;
}

.hero h1 span {
color:var(--blue);
text-shadow:0 0 30px #38bdf855;
}

.hero h2 {
color:var(--cyan);
font-size:clamp(16px,3vw,23px);
}

.hero p {
max-width:720px;
color:var(--muted);
margin:18px auto;
}

.orb {
width:110px;
height:110px;
border-radius:50%;
border:1px solid var(--blue);
display:grid;
place-items:center;
font-size:52px;
margin-bottom:25px;
box-shadow:0 0 35px #38bdf833,inset 0 0 30px #38bdf822;
animation:float 4s ease-in-out infinite;
}

@keyframes float {
50% {transform:translateY(-12px)}
}

.actions {
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.status {
margin-top:28px;
color:var(--green);
font-size:12px;
}

section {
padding:65px 8%;
scroll-margin-top:80px;
}

.heading {
font-size:clamp(24px,4vw,32px);
margin-bottom:8px;
}

.heading span {
color:var(--blue);
}

.sub {
color:var(--muted);
margin-bottom:25px;
}

.grid {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:17px;
}

.card,.tool {
background:var(--panel);
border:1px solid var(--border);
border-radius:14px;
padding:22px;
transition:.25s;
}

.card:hover,.tool:hover {
transform:translateY(-5px);
border-color:var(--blue);
box-shadow:0 12px 30px #0005;
}

.card h3,.tool b {
color:var(--cyan);
margin:7px 0;
}

.card p,.tool p {
color:var(--muted);
font-size:14px;
}

.emoji {
font-size:30px;
}

.pill {
display:inline-block;
background:#38bdf815;
color:var(--cyan);
border:1px solid #38bdf844;
border-radius:20px;
padding:4px 11px;
font-size:12px;
margin:4px;
}

.tabs {
display:flex;
gap:9px;
flex-wrap:wrap;
}

.tab {
padding:9px 14px;
border:1px solid var(--border);
background:var(--panel);
color:var(--muted);
border-radius:8px;
}

.tab.active,.tab:hover {
background:#124267;
color:white;
border-color:var(--blue);
}

.info,.detail {
background:var(--panel2);
border:1px solid var(--border);
padding:22px;
border-radius:12px;
margin-top:14px;
min-height:110px;
color:#c5d7e8;
}

.info h3,.detail h3 {
color:var(--cyan);
margin-bottom:8px;
}

.steps {
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.step {
background:var(--panel);
border:1px solid var(--border);
padding:15px 8px;
border-radius:12px;
color:var(--muted);
text-align:center;
cursor:pointer;
}

.step.active,.step:hover {
border-color:var(--blue);
background:#123552;
color:white;
}

.step strong {
display:block;
color:var(--cyan);
font-size:22px;
}

.casebox,.quizbox,.activity {
background:linear-gradient(145deg,#102943,#0b1a2c);
border:1px solid var(--blue);
border-radius:15px;
padding:24px;
}

.choice {
display:block;
width:100%;
text-align:left;
background:#0b1b2c;
border:1px solid var(--border);
color:var(--white);
padding:12px 14px;
border-radius:8px;
margin:9px 0;
transition:.2s;
}

.choice:hover:not(:disabled) {
border-color:var(--cyan);
background:#16334d;
}

.choice:disabled {
cursor:default;
opacity:.85;
}

.feedback {
margin-top:13px;
min-height:28px;
color:var(--green);
}

.progress {
height:8px;
background:#23394d;
border-radius:10px;
margin:13px 0;
}

.bar {
height:100%;
background:linear-gradient(90deg,var(--blue),var(--pink));
width:0%;
transition:.3s;
border-radius:10px;
}

.activity-grid {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:16px;
}

.activity-card {
background:linear-gradient(145deg,#122c46,#0b1a2c);
border:1px solid var(--border);
border-radius:14px;
padding:20px;
transition:.25s;
}

.activity-card:hover {
transform:translateY(-5px);
border-color:var(--pink);
}

.activity-card h3 {
color:var(--cyan);
margin:8px 0;
}

.activity-card p {
color:var(--muted);
font-size:14px;
margin-bottom:12px;
}

.scoreline {
display:flex;
gap:12px;
flex-wrap:wrap;
margin:15px 0;
}

.stat {
background:#0b1b2c;
border:1px solid var(--border);
border-radius:10px;
padding:9px 14px;
color:var(--cyan);
}

.hidden {
display:none!important;
}

.mini-title {
color:var(--pink);
font-size:12px;
letter-spacing:1px;
}

.case-meta {
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
color:var(--muted);
font-size:13px;
margin-bottom:10px;
}

.gallery {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:16px;
}

.gallery figure {
margin:0;
overflow:hidden;
border:1px solid var(--border);
border-radius:14px;
background:var(--panel);
}

.gallery img {
display:block;
width:100%;
height:165px;
object-fit:cover;
transition:.35s;
}

.gallery figure:hover img {
transform:scale(1.05);
}

.gallery figcaption {
padding:13px;
color:var(--muted);
font-size:14px;
}

.gallery figcaption b {
display:block;
color:var(--cyan);
margin-bottom:3px;
}

.hunt-grid {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:12px;
margin-top:18px;
}

.hunt-item {
min-height:145px;
border:1px solid var(--border);
border-radius:13px;
background:linear-gradient(145deg,#173957,#0b1b2c);
color:var(--white);
padding:15px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
transition:.2s;
}

.hunt-item:hover:not(:disabled) {
border-color:var(--cyan);
transform:translateY(-3px);
}

.hunt-item .big {
font-size:38px;
}

.hunt-item small {
color:var(--muted);
}

.hunt-item.found {
border-color:var(--green);
background:#12352e;
}

.hunt-item.missed {
border-color:var(--gold);
opacity:.75;
}

.game-status {
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:14px;
}

.game-status span {
background:#0b1b2c;
border:1px solid var(--border);
border-radius:9px;
padding:8px 12px;
color:var(--cyan);
}

.ar {
direction:rtl;
font-family:Arial,sans-serif;
}

.ar nav {
direction:rtl;
}

.ar .choice {
text-align:right;
}

.ar .hero,.ar section {
text-align:right;
}

.ar .hero {
text-align:center;
}

.ar .actions,.ar .tabs {
justify-content:flex-start;
}

.ar .activity-card,.ar .card {
text-align:right;
}

footer {
text-align:center;
padding:30px;
border-top:1px solid var(--border);
color:var(--muted);
}

@media(max-width:720px) {
nav {
justify-content:center;
}

nav div:nth-child(2) {
width:100%;
text-align:center;
order:3;
}

nav a {
margin:0 4px;
}

section {
padding:48px 5%;
}

.steps {
grid-template-columns:repeat(2,1fr);
}
}
</style>
</head>

<body>
